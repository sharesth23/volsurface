[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Volsurface"
version = "0.1.0"
authors = [ {name = " Sharesth " ,  email = " sharesth444yt@gmailcom"}]
description = "A professional quantitative finance library for volatility surface modeling"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn"
]
"Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
"Homepage" = "https://github.com/sharesth23/volsurface"


